{% extends "base.html" %}
{% block title %}500 · 服务器错误{% endblock %}
{% block page_title %}500 · 服务器错误{% endblock %}
{% block page_sub %}操作未能完成，数据库事务已回滚{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body text-center py-5">
    <i class="bi bi-exclamation-octagon" style="font-size:42px;color:#a32632;"></i>
    <h5 class="mt-3">系统处理出错</h5>
    <p class="text-muted mb-4">
      数据库已回滚本次写入，不会留下半成品数据。<br>
      请检查输入内容后重试；若持续出现，请查看应用日志。
    </p>
    <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">返回工作台</a>
  </div>
</div>
{% endblock %}
